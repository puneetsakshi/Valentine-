<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Will You Be My Valentine?</title>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,#ffdde1,#ee9ca7);
      overflow:hidden;
    }

    .card{
      width:min(520px,92vw);
      background:#ffffffcc;
      border-radius:20px;
      padding:24px;
      text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,.2);
      position:relative;
    }

    h1{
      margin-bottom:10px;
    }

    p{
      margin-bottom:20px;
    }

    .stage{
      position:relative;
      height:220px;
      background:rgba(255,255,255,.6);
      border-radius:16px;
      overflow:hidden;
    }

    button{
      position:absolute;
      padding:12px 20px;
      border:none;
      border-radius:999px;
      font-size:16px;
      cursor:pointer;
      transform:translate(-50%,-50%);
      box-shadow:0 10px 25px rgba(0,0,0,.15);
    }

    #yes{
      background:#22c55e;
      color:white;
      left:50%;
      top:65%;
    }

    #no{
      background:#ef4444;
      color:white;
      left:50%;
      top:35%;
    }

    .msg{
      display:none;
      margin-top:18px;
      font-size:18px;
      font-weight:bold;
    }

    .hint{
      margin-top:10px;
      font-size:13px;
      opacity:.7;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Will you be my Valentine, Madam ji? 💘</h1>
    <p>Ek simple sa sawaal… 😄</p>

    <div class="stage" id="stage">
      <button id="no">No 🙈</button>
      <button id="yes">Yes 😍</button>
    </div>

    <div class="msg" id="msg">
      Yayyy Madam ji! 💖  
      First Valentine together… aur last tak tum hi ❤️
    </div>

    <div class="hint">
      Hint: “No” thoda sharmila hai 😜
    </div>
  </div>

<script>
  const stage = document.getElementById("stage");
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const msg = document.getElementById("msg");

  function moveNoButton(){
    const rect = stage.getBoundingClientRect();
    const x = 30 + Math.random() * (rect.width - 60);
    const y = 30 + Math.random() * (rect.height - 60);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  stage.addEventListener("mousemove", () => {
    moveNoButton();
  });

  noBtn.addEventListener("touchstart", (e) => {
    moveNoButton();
    e.preventDefault();
  });

  yesBtn.addEventListener("click", () => {
    msg.style.display = "block";
    noBtn.style.display = "none";
    yesBtn.innerText = "Always ❤️";
  });

  moveNoButton();
</script>

</body>
</html>
