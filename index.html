<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Madam ji ❤️</title>

  <style>
    :root{
      --bg1:#fde2e4; --bg2:#cddafd;
      --card: rgba(255,255,255,.82);
      --shadow: 0 18px 50px rgba(0,0,0,.18);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100svh;
      display:flex; align-items:center; justify-content:center;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background: linear-gradient(135deg,var(--bg1),var(--bg2));
      padding: 18px;
      overflow:hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .card{
      width:min(560px,96vw);
      background:var(--card);
      border:1px solid rgba(255,255,255,.7);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 18px 16px 16px;
      box-shadow: var(--shadow);
      position:relative;
    }
    h1{
      margin: 4px 0 8px;
      font-size: 26px;
      line-height: 1.15;
      text-align:center;
    }
    .sub{
      margin: 0 0 14px;
      text-align:center;
      font-size: 15px;
      opacity: .85;
    }
    .note{
      background: rgba(255,255,255,.65);
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 18px;
      padding: 14px 12px;
      font-size: 16px;
      line-height: 1.45;
      min-height: 120px;
      text-align:center;
    }
    .actions{
      margin-top: 16px;
      display:flex;
      gap:12px;
      justify-content:center;
    }
    button{
      border:0;
      border-radius:999px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 800;
      cursor:pointer;
      box-shadow: 0 12px 28px rgba(0,0,0,.14);
      user-select:none;
    }
    .b1{ background:#111827; color:#fff; }
    .b2{ background:#22c55e; color:#fff; }

    .heart{
      position:fixed;
      transform:translate(-50%,-50%);
      font-size:18px;
      opacity:0;
      animation: floatUp 1.9s ease-in forwards;
      pointer-events:none;
      z-index: 99;
    }
    @keyframes floatUp{
      0%{ transform:translate(-50%,-10%) scale(.9); opacity:0}
      15%{ opacity:1}
      100%{ transform:translate(-50%,-220%) scale(1.35); opacity:0}
    }

    .wiggle{ animation: wiggle .25s ease-in-out 2; }
    @keyframes wiggle{
      0%{ transform:translateY(0) }
      25%{ transform:translateY(-2px) }
      50%{ transform:translateY(0) }
      75%{ transform:translateY(-2px) }
      100%{ transform:translateY(0) }
    }

    .small{
      margin-top: 12px;
      font-size: 12.5px;
      opacity: .7;
      text-align:center;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Madam ji… ❤️</h1>
  <div class="sub">Main bas itna chahta hoon ki aap theek feel karo.</div>

  <div class="note" id="note">
    Agar meri kisi baat ya action se aap hurt hui ho,<br>
    main genuinely sorry hoon.<br><br>
    Koi pressure nahi… bas dil se. 🤍
  </div>

  <div class="actions">
    <button class="b1" id="upset">Abhi bhi thoda gussa 😤</button>
    <button class="b2" id="ok">Okay… thoda sa 😊</button>
  </div>

  <div class="small">
     hearts ✨
  </div>
</div>

<audio id="bgm" preload="auto" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7c7f6c7b7a.mp3" type="audio/mpeg">
</audio>

<script>
  const note = document.getElementById('note');
  const upsetBtn = document.getElementById('upset');
  const okBtn = document.getElementById('ok');
  const bgm = document.getElementById('bgm');

  const upsetLines = [
    "Theek hai… aap gussa raho. Main yahin hoon. 🫶",
    "Aapka gussa valid hai. Main bas better banna chahta hoon. 🤍",
    "Jitna time chahiye le lo… main rush nahi kar raha. 🙂"
  ];
  const okLines = [
    "Thank you… sach me. 🥺❤️",
    "Ek chhoti si smile kaafi hai mere liye. 😊",
    "Aaj nahi toh kal, main prove kar dunga. 🤝"
  ];

  function randomPick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function heartBurst(n=12){
    const emojis = ["💗","💖","💘","💕","❤️"];
    for(let i=0;i<n;i++){
      const s = document.createElement('span');
      s.className = 'heart';
      s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      s.style.left = (40 + Math.random()*20) + "%";
      s.style.top  = (58 + Math.random()*10) + "%";
      s.style.fontSize = (16 + Math.random()*16) + "px";
      s.style.animationDelay = (Math.random()*0.15) + "s";
      document.body.appendChild(s);
      s.addEventListener('animationend', ()=> s.remove());
    }
  }

  async function startMusic(){
    try{
      bgm.volume = 0.6;
      await bgm.play();
    }catch(e){}
  }

  upsetBtn.addEventListener('click', () => {
    note.innerHTML = randomPick(upsetLines);
    upsetBtn.classList.remove('wiggle');
    void upsetBtn.offsetWidth;
    upsetBtn.classList.add('wiggle');
    heartBurst(6);
  });

  okBtn.addEventListener('click', async () => {
    note.innerHTML = randomPick(okLines);
    heartBurst(16);
    await startMusic();
  });
</script>

</body>
</html>
